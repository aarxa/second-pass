<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Second Pass</title>
    <meta name="description" content="A collaborative shader playground with an AI agent that checks its own work." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <!-- The card shown when the link is shared (LinkedIn, Slack, iMessage...). Images need absolute URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Second Pass" />
    <meta property="og:title" content="Second Pass: it draws, looks at what it drew, and takes a second pass" />
    <meta property="og:description" content="A live, multiplayer GLSL shader editor with an AI agent that renders its own frames, has them judged, and revises until they pass." />
    <meta property="og:url" content="https://second-pass.netlify.app/" />
    <meta property="og:image" content="https://second-pass.netlify.app/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="A black hole shader written by the agent, scored 8 out of 10 by its judge" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#fbfbf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121417" media="(prefers-color-scheme: dark)" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" />
    <script>
      // Apply a saved light/dark choice before the first paint, so the page never flashes the other theme.
      try { var t = localStorage.getItem('secondpass.theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
