# Render Blueprint: the server, built from the Dockerfile. The database is Neon (docs/MOVE_DB.md),
# so DATABASE_URL is set by hand in the Render dashboard and never synced from this file.
# Render injects PORT; the server reads it. The free web service sleeps after ~15 min idle
# (first request then takes ~30-60 s).
services:
  - type: web
    name: shaderlab
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      # Neon's connection string, set in the dashboard. sync: false means a Blueprint sync never
      # overwrites it (this used to point at a Render database, which free plans expire).
      - key: DATABASE_URL
        sync: false
      # The free plan gets a fraction of one CPU; one full core handled ~1,000 editors (docs/M5_EXPLAINED.md).
      - key: MAX_CONNECTIONS
        value: "100"
      # Protects GET /metrics; Render generates a random value (visible in the dashboard).
      - key: METRICS_TOKEN
        generateValue: true
      # The site owner's key: takes any shader out of the gallery. Set it yourself in the dashboard
      # (never commit it), then save the same value in your browser at /admin.
      - key: ADMIN_TOKEN
        sync: false
