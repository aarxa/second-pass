# Load-test setup: the production image, limited to 1 CPU and 512 MB like a small cloud instance.
#   docker compose -f docker-compose.yml -f docker-compose.load.yml up -d --build app
services:
  app:
    cpus: 1.0
    mem_limit: 512m
    environment:
      # The load generator creates hundreds of rooms from one machine; lift the hourly creation limits.
      CREATE_LIMIT_PER_CLIENT: "1000000"
      CREATE_LIMIT_TOTAL: "1000000"
