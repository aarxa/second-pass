# The site on Netlify: the built web app, served from Netlify's CDN, so pages open instantly and
# the runs, replays and frames never touch the server. The server (API + live editing) runs on its
# own (docs/HOSTING.md). Netlify forwards /api/* to it; the live editor's WebSocket can't be
# forwarded, so the editor connects to the server directly (VITE_COLLAB_URL, baked in at build).
[build]
  command = "npm run build -w web"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "22"
  VITE_COLLAB_URL = "wss://shaderlab.onrender.com/collab"

[[redirects]]
  from = "/api/*"
  to = "https://shaderlab.onrender.com/api/:splat"
  status = 200
  force = true

# Every other path is a page of the app (/s/<id>, /gallery, /agent/<run>) unless it is a real file.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Built files have a content hash in their name, so they never change.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
